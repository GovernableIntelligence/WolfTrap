name: Offline product foundation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed:
    name: Offline wheel and first scan (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out the pinned candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.CANDIDATE_HEAD }}
          persist-credentials: false

      - name: Select the test interpreter
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
          cache: ''

      - name: Acquire the reviewed build-only wheel by digest
        shell: bash
        run: |
          set -euo pipefail
          python -I -m pip --isolated download --disable-pip-version-check --no-cache-dir --no-deps --only-binary=:all: --require-hashes --index-url https://pypi.org/simple -r .github/product-builder.lock --dest "$RUNNER_TEMP/product-tools"

      - name: Build, install, exercise, independently check and screen the candidate offline
        shell: bash
        run: |
          set -euo pipefail
          parent_namespace=$(readlink /proc/self/ns/net)
          temp=$(realpath "$RUNNER_TEMP")
          sudo unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" \
            --clear-groups --no-new-privs --bounding-set=-all -- env -i \
            PATH="$PATH" PYTHONDONTWRITEBYTECODE=1 PYTHONHASHSEED=0 python -I scripts/qualify-product.py \
            --expected-head "$CANDIDATE_HEAD" --parent-netns "$parent_namespace" \
            --wheelhouse "$temp/product-tools" --output-dir "$temp/product-result"

      - name: Retain only the candidate wheel and declared qualification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wolftrap-product-candidate-${{ matrix.runner }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/product-result/kit/wolftrap-0.5.4.dev1-py3-none-any.whl
            ${{ runner.temp }}/product-result/kit/SHA256SUMS
            ${{ runner.temp }}/product-result/kit/core.cdx.json
            ${{ runner.temp }}/product-result/qualification.json
            ${{ runner.temp }}/product-result/doctor.json
            ${{ runner.temp }}/product-result/controls.json
            ${{ runner.temp }}/product-result/unit-tests.json
            ${{ runner.temp }}/product-result/demo/quickscan.json
            ${{ runner.temp }}/product-result/demo/quickscan.md
            ${{ runner.temp }}/product-result/demo/quickscan.sarif
            ${{ runner.temp }}/product-result/demo/quickscan.manifest.json
